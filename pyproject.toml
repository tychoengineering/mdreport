[project]
name = "mdreport"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Asif Rahman", email = "asiftr@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "markdown-it-py>=4.0.0",
    "mdformat>=1.0.0",
    "mdformat-gfm>=1.0.0",
    "polars>=1.44.1",
    "pyyaml>=6.0",
]

[project.scripts]
mdreport = "mdreport:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
]
